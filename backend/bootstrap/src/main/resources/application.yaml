server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:purpuragenda-local}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
spring:
  application:
    name: purpuragenda
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/purpuragenda}
    username: ${DATABASE_USER:purpuragenda_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  liquibase:
    enabled: ${MIGRATIONS_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  mode: ${APP_MODE:local}
  key-file: ${APP_KEY_FILE:.secrets/encryption-key}
  key-id: ${APP_KEY_ID:local-1}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  owner-email: ${OWNER_NOTIFICATION_EMAIL:owner@example.test}
  mail-from: ${MAIL_FROM:bookings@example.test}
  delivery-mode: ${DELIVERY_MODE:CAPTURE}
  privacy-notice-version: ${PRIVACY_NOTICE_VERSION:local-draft}
logging:
  level:
    root: WARN
    org.springframework.boot: INFO
    org.apache.catalina: WARN
