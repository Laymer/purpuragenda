name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/ci/run-python-tests.py --start scripts/ci
      - run: python3 scripts/ci/check-docs.py
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - name: Require pinned PostgreSQL test dependency
        run: |
          docker version --format 'Docker server {{.Server.Version}} API {{.Server.APIVersion}}' 2>/dev/null || { echo DOCKER_UNAVAILABLE; exit 1; }
          docker pull --quiet postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc 2>/dev/null || { echo PINNED_POSTGRES_PULL_FAILED; exit 1; }
      - run: bash scripts/ci/verify-build.sh
      - name: Retain Angular verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: angular-verification
          path: |
            frontend/coverage/junit.xml
            frontend/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 14
  delivery-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test delivery policy without skips
        run: python3 scripts/ci/run-python-tests.py --start scripts/ci/tests
      - name: Require tests in every new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/check-commit-tests.py --base "$BASE" --head "$HEAD"
      - name: Verify live main protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/main-protection.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/dev/install-security-tools.py
      - run: python3 scripts/ci/check-secrets.py
      - name: Retain count-only scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-receipt
          path: artifacts/security/secrets.json
          if-no-files-found: error
          retention-days: 14
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - run: bash -c 'source scripts/dev/toolchain-env.sh; python3 scripts/ci/check-contract.py'
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - run: python3 scripts/dev/install-security-tools.py --tool osv-scanner
      - run: bash -c 'source scripts/dev/toolchain-env.sh; python3 scripts/ci/check-dependencies.py'
      - name: Retain sanitized Java SBOM and advisory receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-receipt
          path: |
            artifacts/security/dependencies.json
            artifacts/security/java.cdx.json
          if-no-files-found: error
          retention-days: 14
  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash scripts/dev/install-toolchain.sh
      - name: Export pinned JDK for extraction
        run: |
          source scripts/dev/toolchain-env.sh
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify source scope and pinned CodeQL bundle
        id: codeql-bundle
        run: python3 scripts/ci/check-sast.py --language "$LANGUAGE" --prepare
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        id: codeql
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: ${{ steps.codeql-bundle.outputs.bundle }}
          config-file: .github/codeql/config.yml
          debug: false
      - name: Build traced Java sources or validate interpreted source scope
        run: |
          source scripts/dev/toolchain-env.sh
          python3 scripts/ci/check-sast.py --language "$LANGUAGE" --compile
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        id: codeql-analysis
        with:
          category: purpuragenda/${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-sarif
          upload: always
          upload-database: false
          wait-for-processing: true
      - name: Require complete sources and no high or critical findings
        if: always()
        env:
          CODEQL_DATABASES: ${{ steps.codeql-analysis.outputs.db-locations }}
        run: python3 scripts/ci/check-sast.py --language "$LANGUAGE" --tool "${{ steps.codeql.outputs.codeql-path }}" --sarif-dir "${{ runner.temp }}/codeql-sarif"
      - name: Retain count-only SAST receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-counts-${{ matrix.language }}
          path: artifacts/security/sast-${{ matrix.language }}.json
          if-no-files-found: error
          retention-days: 14
  verify:
    if: always()
    needs: [documentation, build, delivery-policy, contracts, secrets, dependencies, sast]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require every implemented category
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check-suites.py --results
