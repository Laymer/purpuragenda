name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/ci/check-docs.py
  verify:
    if: always()
    needs: [documentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every implemented category
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), 'Verification failed, skipped or cancelled'
          PY
