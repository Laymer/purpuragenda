name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/ci/run-python-tests.py --start scripts/ci
      - run: python3 scripts/ci/check-docs.py
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - run: bash scripts/ci/verify-build.sh
  delivery-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test delivery policy without skips
        run: python3 scripts/ci/run-python-tests.py --start scripts/ci/tests
      - name: Require tests in every new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/check-commit-tests.py --base "$BASE" --head "$HEAD"
      - name: Verify live main protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/main-protection.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/dev/install-security-tools.py
      - run: python3 scripts/ci/check-secrets.py
      - name: Retain count-only scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-receipt
          path: artifacts/security/secrets.json
          if-no-files-found: error
          retention-days: 14
  verify:
    if: always()
    needs: [documentation, build, delivery-policy, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every implemented category
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), 'Verification failed, skipped or cancelled'
          PY
