name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/ci/run-python-tests.py --start scripts/ci
      - run: python3 scripts/ci/check-docs.py
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - name: Require pinned PostgreSQL test dependency
        run: |
          docker version --format 'Docker server {{.Server.Version}} API {{.Server.APIVersion}}' 2>/dev/null || { echo DOCKER_UNAVAILABLE; exit 1; }
          docker pull --quiet postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc 2>/dev/null || { echo PINNED_POSTGRES_PULL_FAILED; exit 1; }
      - run: bash scripts/ci/verify-build.sh
  delivery-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test delivery policy without skips
        run: python3 scripts/ci/run-python-tests.py --start scripts/ci/tests
      - name: Require tests in every new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/check-commit-tests.py --base "$BASE" --head "$HEAD"
      - name: Verify live main protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/main-protection.py
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/dev/install-toolchain.sh
      - run: bash -c 'source scripts/dev/toolchain-env.sh; python3 scripts/ci/check-contract.py'
  verify:
    if: always()
    needs: [documentation, build, delivery-policy, contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every implemented category
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), 'Verification failed, skipped or cancelled'
          PY
