        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateProofRequest"
              }
            }
          }
        },
        "description": "Requires the exact Origin, a live session and its CSRF proof. Emails a single-use 15 minute booking-creation proof bound to this browser. The emailed link carries the proof in a URL fragment: the landing page must remove the fragment and redeem it only through POST /guest/redemptions.",
        "responses": {
          "202": {
            "description": "Accepted. Identical for known and unknown contacts; carries no authority.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProofAccepted"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_REQUEST",
            "headers": {
