                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionBootstrap"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_REQUEST; credentials or JSON shape are invalid",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
