          "429": {
            "description": "RATE_LIMITED: 60 second cooldown, 5 per hour per address, 30 per hour per client address",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
