    "/admin/login": {
      "post": {
        "operationId": "loginAdministrator",
        "tags": [
          "Administrator"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43,
              "pattern": "^[A-Za-z0-9_-]{43}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AdministratorLoginRequest"
              }
            }
          }
        },
        "description": "Requires the exact Origin, a current session and its CSRF proof. Reserves the normalized account/client-network attempt limit before password/TOTP work. A purpose/browser/request-bound factor proof remains server-internal and is consumed once to rotate the administrator session and CSRF proof. Unknown, disabled, unenrolled, wrong-password, replayed-factor and revoked-authority failures are indistinguishable. Recovery grants cannot create this session.",
        "responses": {
          "200": {
            "description": "Rotated administrator session after fresh password and TOTP",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Replaces the session cookie.",
