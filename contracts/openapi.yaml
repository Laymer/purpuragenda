    "/guest/redemptions": {
      "post": {
        "operationId": "redeemGuestProof",
        "tags": [
          "Guest"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43,
              "pattern": "^[A-Za-z0-9_-]{43}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RedeemProofRequest"
              }
            }
          }
        },
        "description": "Requires the exact Origin, a live session and its CSRF proof. Atomically consumes the proof and rotates the session to a guest session bound to the same browser, issuing a new cookie and CSRF proof. Unknown, replayed, expired, wrong-purpose and wrong-browser proofs are indistinguishable.",
        "responses": {
          "200": {
            "description": "Rotated guest session",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Replaces the session cookie.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionBootstrap"
                }
              }
            }
          },
          "400": {
            "description": "PROOF_INVALID",
            "headers": {
