          "default": {
            "description": "Safe private problem; never raw errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/session/logout": {
      "post": {
        "operationId": "logoutSession",
        "tags": [
          "Session"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43,
              "pattern": "^[A-Za-z0-9_-]{43}$"
            }
          }
        ],
        "description": "Requires the exact configured Origin, a live persisted session and its current CSRF proof. Revokes the session and clears the cookie.",
        "responses": {
          "204": {
            "description": "Revoked",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Expires the session cookie.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Safe private problem; never raw errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        }
      }
    },
