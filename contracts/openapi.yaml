            "minimum": 0
          },
          "remainingMinor": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "refundDueByCurrency": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            },
            "propertyNames": {
              "pattern": "^[A-Z]{3}$"
            }
          },
          "receivedByCurrency": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            },
            "propertyNames": {
              "pattern": "^[A-Z]{3}$"
            }
          }
        },
        "description": "Independent external money facts. Approval never implies payment; outstanding refunds take precedence."
      },
      "CustomerBookingStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "reference",
          "version",
          "state",
          "pendingExpired",
          "service",
          "startInstant",
          "sessionEndInstant",
          "displayZone",
          "deliveryEmail",
          "pendingExpiresAt",
          "customerChangesUntil",
          "serverNow",
          "meetingUrl",
          "payment",
          "allowedActions"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "reference": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING_CONFIRMATION",
              "CONFIRMED",
              "REJECTED",
              "EXPIRED",
              "CANCELLED",
              "COMPLETED",
              "NO_SHOW"
            ]
          },
          "pendingExpired": {
            "type": "boolean"
          },
          "service": {
            "$ref": "#/components/schemas/BookingServiceSnapshot"
          },
          "startInstant": {
            "type": "string",
            "format": "date-time"
          },
          "sessionEndInstant": {
            "type": "string",
            "format": "date-time"
          },
          "displayZone": {
            "type": "string"
          },
          "deliveryEmail": {
            "type": "string",
            "format": "email"
          },
          "pendingExpiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "customerChangesUntil": {
            "type": "string",
            "format": "date-time"
          },
          "serverNow": {
            "type": "string",
            "format": "date-time"
          },
          "meetingUrl": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          },
          "payment": {
            "$ref": "#/components/schemas/BookingPaymentSummary"
          },
          "allowedActions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "CANCEL",
                "RESCHEDULE"
              ]
            },
            "description": "Sorted distinct JSON array; the typed browser client receives an array without object hydration."
          }
        },
        "description": "One authorized read-only snapshot. Stored state/version remain unchanged by GET; pendingExpired marks a due hold awaiting reclamation. No intake, stable identity identifiers or payment references are exposed. Meeting URL is present only while confirmed."
      }
