{
  "openapi": "3.1.0",
  "info": {
    "title": "Purpuragenda version 1",
    "version": "0.1.0",
    "description": "Public catalog contract foundation. Availability is advisory and dates use the selected IANA display zone. Remaining v1 endpoints are added with their owning tasks. Online checkout is excluded. Session endpoints require same-origin browser requests: unsafe requests carry the exact configured Origin and a persisted-session CSRF header."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/services": {
      "get": {
        "operationId": "listServices",
        "tags": [
          "Catalog"
        ],
        "parameters": [],
        "responses": {
          "200": {
            "description": "Committed result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Service"
                  }
                }
              }
            },
            "headers": {
              "ETag": {
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-cache"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Safe problem; never raw errors",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "304": {
            "description": "Unchanged since the supplied ETag",
            "headers": {
              "ETag": {
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-cache"
                  ]
                }
              }
            }
          }
        },
        "security": [],
        "description": "Active catalog. Revalidated on every use (Cache-Control: no-cache) with a strong ETag; send If-None-Match to receive 304. Each service carries the version later bound by booking review."
      }
    },
    "/availability": {
      "get": {
        "operationId": "availability",
        "tags": [
          "Catalog"
        ],
        "parameters": [
          {
            "name": "serviceId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Active service; archived or unknown services are 404."
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "displayZone",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64
            },
            "description": "IANA zone identifier selecting the display zone."
          }
        ],
        "responses": {
          "200": {
            "description": "Committed result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Availability"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Safe problem; never raw errors",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_REQUEST, INVALID_ZONE, INVALID_DATE_RANGE or RANGE_TOO_WIDE",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "SERVICE_UNAVAILABLE",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "RATE_LIMITED",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Retry-After": {
                "description": "Whole seconds until the fixed throttle window ends (at least 1).",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "TEMPORARILY_UNAVAILABLE (retryable)",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "security": [],
        "description": "Advisory slots for an inclusive display-date range of at most 31 dates. Omit DST gaps and return both overlap instants with explicit offsets. Never cacheable (Cache-Control: no-store): revalidate all availability during booking mutations. Throttled to 120 requests per minute per client address; malformed requests are charged too."
      }
    },
    "/session/bootstrap": {
      "post": {
        "operationId": "bootstrapSession",
        "tags": [
          "Session"
        ],
        "security": [],
        "parameters": [],
        "description": "Requires the exact configured Origin and no cross-site Fetch Metadata. Creates an anonymous guest session, or rotates only the CSRF proof of a current live session. The CSRF proof is stored as a digest only, so a page reload must call this endpoint again. No body.",
        "responses": {
          "200": {
            "description": "Session state with a fresh CSRF proof",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Only when a new anonymous guest session is created: __Host-purpuragenda (Secure, HttpOnly, SameSite=Lax, Path=/, no Domain); local HTTP uses purpuragenda-local without Secure.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionBootstrap"
                }
              }
            }
          },
          "default": {
            "description": "Safe private problem; never raw errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/session": {
      "get": {
        "operationId": "getSession",
        "tags": [
          "Session"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [],
        "description": "Safe role and deadlines only. Read-only: it does not extend the idle lifetime. Never returns identifiers, grants or CSRF proofs.",
        "responses": {
          "200": {
            "description": "Current session state",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionState"
                }
              }
            }
          },
          "default": {
            "description": "Safe private problem; never raw errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/session/logout": {
      "post": {
        "operationId": "logoutSession",
        "tags": [
          "Session"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43,
              "pattern": "^[A-Za-z0-9_-]{43}$"
            }
          }
        ],
        "description": "Requires the exact configured Origin, a live persisted session and its current CSRF proof. Revokes the session and clears the cookie.",
        "responses": {
          "204": {
            "description": "Revoked",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Expires the session cookie.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Safe private problem; never raw errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Service": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "durationMinutes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 120
          },
          "priceMinor": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "currency": {
            "type": "string",
            "enum": [
              "EUR"
            ]
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "version",
          "name",
          "durationMinutes",
          "priceMinor",
          "currency",
          "active"
        ]
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "retryable": {
            "type": "boolean"
          },
          "refreshAvailability": {
            "type": "boolean"
          }
        },
        "required": [
          "status",
          "code",
          "correlationId",
          "retryable",
          "refreshAvailability"
        ]
      },
      "Slot": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "startInstant": {
            "type": "string",
            "format": "date-time"
          },
          "sessionEndInstant": {
            "type": "string",
            "format": "date-time"
          },
          "reservedEndInstant": {
            "type": "string",
            "format": "date-time"
          },
          "businessDate": {
            "type": "string",
            "format": "date"
          },
          "displayLocalTime": {
            "type": "string"
          },
          "offset": {
            "type": "string"
          }
        },
        "required": [
          "startInstant",
          "sessionEndInstant",
          "reservedEndInstant",
          "businessDate",
          "displayLocalTime",
          "offset"
        ]
      },
      "Availability": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "serverNow": {
            "type": "string",
            "format": "date-time"
          },
          "businessZone": {
            "type": "string",
            "enum": [
              "Europe/Brussels"
            ]
          },
          "displayZone": {
            "type": "string"
          },
          "horizonInstant": {
            "type": "string",
            "format": "date-time"
          },
          "policyVersion": {
            "type": "integer"
          },
          "slots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Slot"
            }
          },
          "restrictions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "serverNow",
          "businessZone",
          "displayZone",
          "horizonInstant",
          "policyVersion",
          "slots",
          "restrictions"
        ]
      },
      "SessionState": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "ANONYMOUS",
              "GUEST",
              "ACCOUNT",
              "ADMIN"
            ]
          },
          "idleExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "absoluteExpiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "role",
          "idleExpiresAt",
          "absoluteExpiresAt"
        ]
      },
      "SessionBootstrap": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "ANONYMOUS",
              "GUEST",
              "ACCOUNT",
              "ADMIN"
            ]
          },
          "idleExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "absoluteExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "csrfToken": {
            "type": "string",
            "minLength": 43,
            "maxLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        },
        "required": [
          "role",
          "idleExpiresAt",
          "absoluteExpiresAt",
          "csrfToken"
        ]
      }
    },
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-purpuragenda"
      }
    }
  }
}
