services:
  web:
    ports: ["127.0.0.1:8080:8080"]
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    profiles: [local]
    ports: ["127.0.0.1:8025:8025"]
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
  backend:
    environment: {DELIVERY_MODE: CAPTURE, SMTP_HOST: mailpit, SMTP_PORT: "1025"}
